name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install dependencies and run tests
      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pytest
      
  
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 4: Build and push Docker image
      - name: Build, tag, and push image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/demo_devops_project:${{ github.sha }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      # Step 5: Save image URI for deploy job
      - name: Export image URI
        run: echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/demo_devops_project:${{ github.sha }}" >> $GITHUB_ENV

  deploy:
  runs-on: ubuntu-latest
  needs: build
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.9.0

    - name: Create backend infra (S3 + DynamoDB)
      run: |
        aws s3 mb s3://my-terraform-state-bucket --region us-east-2 || true
        aws dynamodb create-table \
          --table-name terraform-locks \
          --attribute-definitions AttributeName=LockID,AttributeType=S \
          --key-schema AttributeName=LockID,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --region us-east-2 || true

    - name: Terraform Init & Apply
      run: |
        cd terraform
        terraform init -reconfigure -input=false
        terraform apply -auto-approve -input=false

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region us-east-2 --name calculator-devops-cluster

    - name: Install Ansible
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible

    - name: Deploy with Ansible
      run: ansible-playbook ansible/deploy.yml
