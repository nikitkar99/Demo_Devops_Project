apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator-app
  template:
    metadata:
      labels:
        app: calculator-app
    spec:
      containers:
      - name: calculator-container
        image: 525881111178.dkr.ecr.us-east-2.amazonaws.com/demo_devops_project:${GITHUB_SHA}
        ports:
        - containerPort: 5000
